<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">病毒、细菌、炎症、用药：一篇说人话的整理</title>
  <desc id="desc">浅青底医疗科普风：标题病毒、细菌、炎症、用药；右侧三张概念卡——病毒、细菌、炎症，各配简笔图标。</desc>

  <rect width="1200" height="360" rx="26" fill="#f2f7f6"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#4e6663">医学科普 · PLAIN-LANGUAGE HEALTH GUIDE</text>
    <text x="56" y="128" font-size="54" font-weight="700" fill="#1f2a28">病毒、细菌、炎症、用药</text>
    <text x="56" y="168" font-size="23" fill="#0f766e">一篇说人话的整理 — 先分清概念，再看怎么用药</text>
    <text x="56" y="204" font-size="19" fill="#4e6663">感染、炎症、抗生素、抗炎药，9 个章节讲明白。</text>
    <g id="chips" font-size="18" fill="#1f2a28" text-anchor="middle">
      <g><rect x="56" y="238" width="126" height="36" rx="18" fill="#e3efec" stroke="#bcd6d1" stroke-width="1.5"/><text x="119" y="262">9 个章节</text></g>
      <g><rect x="194" y="238" width="126" height="36" rx="18" fill="#e3efec" stroke="#bcd6d1" stroke-width="1.5"/><text x="257" y="262">9 张插画</text></g>
      <g><rect x="332" y="238" width="126" height="36" rx="18" fill="#e3efec" stroke="#bcd6d1" stroke-width="1.5"/><text x="395" y="262">移动优先</text></g>
      <g><rect x="470" y="238" width="150" height="36" rx="18" fill="#e3efec" stroke="#bcd6d1" stroke-width="1.5"/><text x="545" y="262">纯静态单页</text></g>
    </g>
  </g>

  <g id="cards" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="760" y="52" font-size="18" fill="#4e6663">先分清几个词，再谈用药</text>
    <!-- virus card -->
    <g>
      <rect x="760" y="72" width="380" height="76" rx="14" fill="#ffffff" stroke="#d5e5e1" stroke-width="1.5"/>
      <g transform="translate(800 110)">
        <circle r="18" fill="#dbeafe" stroke="#3b82a0" stroke-width="2"/>
        <g stroke="#3b82a0" stroke-width="2.5" stroke-linecap="round">
          <line x1="0" y1="-18" x2="0" y2="-26"/><line x1="0" y1="18" x2="0" y2="26"/>
          <line x1="-18" y1="0" x2="-26" y2="0"/><line x1="18" y1="0" x2="26" y2="0"/>
          <line x1="-13" y1="-13" x2="-18" y2="-18"/><line x1="13" y1="-13" x2="18" y2="-18"/>
          <line x1="-13" y1="13" x2="-18" y2="18"/><line x1="13" y1="13" x2="18" y2="18"/>
        </g>
        <circle cx="-6" cy="-4" r="3" fill="#3b82a0"/><circle cx="6" cy="5" r="3" fill="#3b82a0"/>
      </g>
      <text x="840" y="102" font-size="22" font-weight="700" fill="#1f2a28">病毒</text>
      <text x="840" y="130" font-size="18" fill="#4e6663">感冒、流感、新冠 — 抗生素对它没用</text>
    </g>
    <!-- bacteria card -->
    <g>
      <rect x="760" y="162" width="380" height="76" rx="14" fill="#ffffff" stroke="#d5e5e1" stroke-width="1.5"/>
      <g transform="translate(800 200)">
        <rect x="-24" y="-12" width="48" height="24" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
        <circle cx="-10" cy="0" r="3" fill="#b45309"/><circle cx="4" cy="0" r="3" fill="#b45309"/><circle cx="14" cy="0" r="2" fill="#b45309"/>
        <g stroke="#b45309" stroke-width="2" stroke-linecap="round">
          <line x1="-24" y1="-8" x2="-30" y2="-14"/><line x1="-24" y1="8" x2="-30" y2="14"/>
          <line x1="24" y1="-8" x2="30" y2="-14"/><line x1="24" y1="8" x2="30" y2="14"/>
        </g>
      </g>
      <text x="840" y="192" font-size="22" font-weight="700" fill="#1f2a28">细菌</text>
      <text x="840" y="220" font-size="18" fill="#4e6663">化脓性扁桃体炎 — 抗生素治的是它</text>
    </g>
    <!-- inflammation card -->
    <g>
      <rect x="760" y="252" width="380" height="76" rx="14" fill="#ffffff" stroke="#d5e5e1" stroke-width="1.5"/>
      <g transform="translate(800 290)">
        <path d="M0 -26 C 10 -12, 14 -6, 8 2 C 14 6, 10 14, 0 14 C -10 14, -14 6, -8 2 C -14 -6, -10 -12, 0 -26 Z" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
        <path d="M0 -10 C 5 -4, 6 0, 3 3 C 6 5, 4 9, 0 9 C -4 9, -6 5, -3 3 C -6 0, -5 -4, 0 -10 Z" fill="#dc2626"/>
      </g>
      <text x="840" y="282" font-size="22" font-weight="700" fill="#1f2a28">炎症</text>
      <text x="840" y="310" font-size="18" fill="#4e6663">身体的防御反应 — 不是所有炎症都要消炎</text>
    </g>
  </g>
</svg>
